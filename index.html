<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LOLLZ GIVEAWAYS | Получи свой скин</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1 class="logo">LOLLZ GIVEAWAYS</h1>
                <p class="tagline">Участвуйте в эксклюзивных розыгрышах и забирайте свои скины</p>
            </header>

            <section class="giveaways-grid">
                <!-- Пример одного элемента розыгрыша -->
                                 <div class="giveaway-card" data-item="Navaja Knife Marble Fade">
                    <img src="navaja-knife-marble-fade-factory-new.png" alt="Navaja Knife Marble Fade" class="item-image">
                    <h3 class="item-name">Navaja Knife Marble Fade</h3>
                    <p class="chance">Шанс выпадения: 0.5%</p>
                    <p class="cost">Стоимость: <span class="free">БЕСПЛАТНО</span></p>
                    <button class="participate-btn">Участвовать</button>
                </div>
                <!-- Добавьте другие карточки аналогично -->
                <div class="giveaway-card" data-item="Glock-18 Shinobu">
                    <img src="glock18.png" alt="Glock-18 Shinobu" class="item-image">
                    <h3 class="item-name">Glock-18 Shinobu</h3>
                    <p class="chance">Шанс выпадения: 1.2%</p>
                    <p class="cost">Стоимость: <span class="free">БЕСПЛАТНО</span></p>
                    <button class="participate-btn">Участвовать</button>
                </div>
                <div class="giveaway-card" data-item="AK-47 Asiimov">
                    <img src='akasimov.webp' alt="AK-47 Asiimov" class="item-image">
                    <h3 class="item-name">AK-47 Asiimov</h3>
                    <p class="chance">Шанс выпадения: 1.7%</p>
                    <p class="cost">Стоимость: <span class="free">БЕСПЛАТНО</span></p>
                    <button class="participate-btn">Участвовать</button>
                </div>
            </section>
        </div>

        <script src="script.js"></script>
    </body>
    </html>
